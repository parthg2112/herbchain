syntax = "proto3";
package herbchain.herbtrace.v1;

import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/parthg2112/herbchain/x/herbtrace/types";

// BatchStatus is the lifecycle stage of a batch. See docs/design.md for transitions.
enum BatchStatus {
  option (gogoproto.goproto_enum_prefix) = false;

  BATCH_STATUS_UNSPECIFIED = 0 [(gogoproto.enumvalue_customname) = "StatusUnspecified"];
  BATCH_STATUS_HARVESTED = 1 [(gogoproto.enumvalue_customname) = "StatusHarvested"];
  BATCH_STATUS_PROCESSED = 2 [(gogoproto.enumvalue_customname) = "StatusProcessed"];
  BATCH_STATUS_TESTED = 3 [(gogoproto.enumvalue_customname) = "StatusTested"];
  BATCH_STATUS_PACKAGED = 4 [(gogoproto.enumvalue_customname) = "StatusPackaged"];
  BATCH_STATUS_SHIPPED = 5 [(gogoproto.enumvalue_customname) = "StatusShipped"];
  BATCH_STATUS_DELIVERED = 6 [(gogoproto.enumvalue_customname) = "StatusDelivered"];
  BATCH_STATUS_REJECTED = 7 [(gogoproto.enumvalue_customname) = "StatusRejected"];
}

// HistoryAction classifies a HistoryEntry.
enum HistoryAction {
  option (gogoproto.goproto_enum_prefix) = false;

  HISTORY_ACTION_UNSPECIFIED = 0 [(gogoproto.enumvalue_customname) = "ActionUnspecified"];
  HISTORY_ACTION_CREATED = 1 [(gogoproto.enumvalue_customname) = "ActionCreated"];
  HISTORY_ACTION_STATUS_UPDATED = 2 [(gogoproto.enumvalue_customname) = "ActionStatusUpdated"];
  HISTORY_ACTION_CUSTODY_TRANSFERRED = 3 [(gogoproto.enumvalue_customname) = "ActionCustodyTransferred"];
  HISTORY_ACTION_LAB_RESULT = 4 [(gogoproto.enumvalue_customname) = "ActionLabResult"];
}

// Batch is a traceable lot of a single herb.
message Batch {
  string id = 1;
  string herb_type = 2;
  string farmer = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string owner = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // Coordinates in microdegrees (degrees x 1e6); no floats in state.
  int64 origin_lat_micro = 5;
  int64 origin_lng_micro = 6;
  // harvest_time is unix seconds.
  int64 harvest_time = 7;
  uint64 quantity_grams = 8;
  string quality_grade = 9;
  repeated string certifications = 10;
  BatchStatus status = 11;
  string location = 12;
  // lab_report_hash is a lowercase sha256 hex digest, empty until tested.
  string lab_report_hash = 13;
  int64 created_height = 14;
  int64 updated_height = 15;
}

// HistoryEntry is one append-only audit record for a batch.
message HistoryEntry {
  string batch_id = 1;
  uint64 seq = 2;
  string actor = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  HistoryAction action = 4;
  BatchStatus from_status = 5;
  BatchStatus to_status = 6;
  string location = 7;
  string note = 8;
  int64 height = 9;
  // time is block time in unix seconds.
  int64 time = 10;
}
