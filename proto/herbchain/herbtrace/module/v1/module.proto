syntax = "proto3";
package herbchain.herbtrace.module.v1;

import "cosmos/app/v1alpha1/module.proto";

option go_package = "github.com/parthg2112/herbchain/x/herbtrace/types";

// Module is the config object for the module.
message Module {
  option (cosmos.app.v1alpha1.module) = {go_import: "github.com/parthg2112/herbchain/x/herbtrace"};

  // authority defines the custom module authority.
  // If not set, defaults to the governance module.
  string authority = 1;
}
